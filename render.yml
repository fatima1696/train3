name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'remotion.config.ts'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Render video (9:16, 30 fps, 40 s)
        run: >
          npx remotion render src/index.ts TrainWheels out/train-wheels.mp4
          --gl=swangle --concurrency=2 --timeout=120000

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: train-wheels-video
          path: out/train-wheels.mp4
          retention-days: 14
